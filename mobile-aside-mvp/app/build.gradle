plugins { id 'com.android.application' }

android {
    namespace 'ai.decisionos.aside'
    compileSdk 35

    defaultConfig {
        applicationId 'ai.decisionos.aside.life'
        minSdk 26
        targetSdk 35
        versionCode 3
        versionName '0.3.0-life-experiment'
    }
    packaging { jniLibs { useLegacyPackaging = true } }
    buildTypes {
        release { minifyEnabled false }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
