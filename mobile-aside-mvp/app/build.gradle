plugins { id 'com.android.application' }

android {
    namespace 'ai.decisionos.aside'
    compileSdk 35

    defaultConfig {
        applicationId 'ai.decisionos.nubi.travelpilot'
        minSdk 26
        targetSdk 35
        testInstrumentationRunner 'ai.decisionos.aside.GoalInstrumentation'
        versionCode 23
        versionName '0.2.4-documents'
    }
    packaging { jniLibs { useLegacyPackaging = true } }
    buildTypes {
        debug { applicationIdSuffix ".goals" }
        experimental { initWith debug; applicationIdSuffix ".laboratory"; matchingFallbacks = ["debug"] }
        release { minifyEnabled false }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
