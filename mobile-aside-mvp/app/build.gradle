plugins { id 'com.android.application' }

android {
    namespace 'ai.decisionos.aside'
    compileSdk 35

    defaultConfig {
        applicationId 'ai.decisionos.aside.concert'
        minSdk 26
        targetSdk 35
        versionCode 5
        versionName '0.5.0-concert-scenario'
    }
    packaging { jniLibs { useLegacyPackaging = true } }
    buildTypes {
        release { minifyEnabled false }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
