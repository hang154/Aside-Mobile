plugins { id 'com.android.application' }

android {
    namespace 'ai.decisionos.aside'
    compileSdk 35

    defaultConfig {
        applicationId 'ai.decisionos.aside.picklecheck'
        minSdk 26
        targetSdk 35
        versionCode 7
        versionName '0.7.0-feature-check'
    }
    packaging { jniLibs { useLegacyPackaging = true } }
    buildTypes {
        release { minifyEnabled false }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
