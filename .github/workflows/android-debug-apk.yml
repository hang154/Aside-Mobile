name: Build Aside Android debug APK
on:
  workflow_dispatch:
  push:
    branches:
      - 'main'
      - 'mobile-aside/**'
    paths:
      - 'mobile-aside-mvp/**'
      - '.github/workflows/android-debug-apk.yml'
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Verify command and proposal rules
        run: |
          cd mobile-aside-mvp
          bash scripts/test_parser.sh
          bash scripts/test_actions.sh
          bash scripts/test_concert.sh
          bash scripts/test_campus.sh
          bash scripts/test_goals.sh
          node scripts/test_goal_extractors.mjs
          python3 scripts/test_goal_security.py
          python3 scripts/test_static.py
          python3 scripts/test_collector.py
      - name: Install Android SDK packages
        run: |
          SDK_MANAGER="$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools" -type f -name sdkmanager | head -1)"
          test -x "$SDK_MANAGER"
          yes | "$SDK_MANAGER" --licenses >/dev/null || true
          "$SDK_MANAGER" 'platforms;android-35' 'build-tools;35.0.0'
      - name: Prepare Android local inference engine
        run: |
          curl -fsSL --retry 3 -o /tmp/llama.tar.gz https://github.com/ggml-org/llama.cpp/releases/download/b12000/llama-b12000-bin-android-arm64.tar.gz
          echo "970428667ebedc0c2c77f9e657463103ce99fffc9bc4bbf8cec0369479e4b826  /tmp/llama.tar.gz" | sha256sum -c -
          mkdir -p /tmp/llama mobile-aside-mvp/app/src/main/jniLibs/arm64-v8a
          tar -xzf /tmp/llama.tar.gz -C /tmp/llama
          cp /tmp/llama/llama-b12000/lib*.so mobile-aside-mvp/app/src/main/jniLibs/arm64-v8a/
          cp /tmp/llama/llama-b12000/llama-completion mobile-aside-mvp/app/src/main/jniLibs/arm64-v8a/libllama_exec.so
      - name: Build APK
        run: |
          cd mobile-aside-mvp
          gradle --no-daemon :app:assembleDebug :app:assembleStandardDebugAndroidTest :app:assembleGroupchatDebugAndroidTest
      - name: Verify package and checksums
        run: |
          find mobile-aside-mvp/app/build/outputs/apk -path '*/debug/*.apk' -print
          sha256sum mobile-aside-mvp/app/build/outputs/apk/*/debug/*.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Aside-Mobile-Debug-APK
          path: mobile-aside-mvp/app/build/outputs/apk/*/debug/*.apk
          if-no-files-found: error
          retention-days: 14
