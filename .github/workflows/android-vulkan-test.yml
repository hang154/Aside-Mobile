name: Android Vulkan engine experiment
on:
  workflow_dispatch:
  push:
    branches: ['mobile-aside/tablet-llm']
    paths: ['.github/workflows/android-vulkan-test.yml']
permissions:
  contents: read
jobs:
  engine:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Install shader compiler and headers
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y glslc libvulkan-dev spirv-headers ninja-build
          mkdir -p /tmp/vulkan-headers
          cp -a /usr/include/vulkan /usr/include/spirv /tmp/vulkan-headers/
      - name: Fetch pinned llama.cpp
        run: git clone --depth 1 --branch b12000 https://github.com/ggml-org/llama.cpp.git /tmp/llama
      - name: Configure Android Vulkan backend
        run: |
          NDK="$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/ndk" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          test -f "$NDK/build/cmake/android.toolchain.cmake"
          cmake -S /tmp/llama -B /tmp/llama-build -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-28 \
            -DCMAKE_BUILD_TYPE=Release -DGGML_NATIVE=OFF -DGGML_OPENMP=OFF \
            -DGGML_CPU_ARM_ARCH=armv8.6-a+dotprod+i8mm+fp16 \
            -DGGML_LLAMAFILE=OFF -DGGML_VULKAN=ON -DLLAMA_CURL=OFF \
            -DCMAKE_FIND_ROOT_PATH_MODE_PACKAGE=BOTH \
            -DVulkan_INCLUDE_DIR=/tmp/vulkan-headers \
            -DVulkan_LIBRARY="$NDK/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/aarch64-linux-android/28/libvulkan.so" \
            -DVulkan_GLSLC_EXECUTABLE=/usr/bin/glslc
      - name: Build engine
        run: cmake --build /tmp/llama-build --target llama-cli llama-bench llama-completion -j 2
      - uses: actions/upload-artifact@v4
        with:
          name: aside-vulkan-android-engine
          path: /tmp/llama-build/bin/
          if-no-files-found: error
          retention-days: 7
